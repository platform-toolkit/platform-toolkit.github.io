# Which directories are workspace projects. pnpm keeps this here rather than in
# package.json, so the root manifest no longer carries a `workspaces` field.
packages:
  - packages/*
  - apps/*

# Dependency lifecycle scripts do not run unless the package is allowed one here.
# A postinstall script in any transitive dependency is arbitrary code execution at
# install time, on developer machines and in the workflow that publishes the site,
# so this list is a decision to make deliberately rather than a warning to silence.
#
# `esbuild` is refused rather than merely absent. It arrives as a dependency of
# both Vite and Storybook's Vite builder, and its install script downloads a
# platform binary. Neither needs it here -- Vite 8 transforms through Rolldown,
# and the Storybook builder reaches esbuild only on code paths this repository
# does not use. Saying `false` records that as an answer, so the next install does
# not re-ask and nobody resolves the prompt by saying yes.
allowBuilds:
  esbuild: false

# One version per dependency across the whole workspace, for the few that more
# than one project declares. Vite is here because the site bundles with it and
# the root tooling type-checks against it: `tsconfig.tests.json` asks for
# `vite/client`, which only resolves if the root has Vite of its own. Two
# manifests naming the same version is a pair that can drift apart silently, and
# the failure -- a test measuring an element against one Vite's ambient types
# while the site is built by another's -- would not look like a version problem.
catalog:
  vite: 8.2.0
