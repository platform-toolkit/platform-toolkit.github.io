name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Callable, so that a scheduled refresh can deploy what it just committed.
  # A push made with GITHUB_TOKEN does not trigger a workflow -- the rule exists
  # to stop a job from starting itself forever -- so a refresh that only pushed
  # would leave the new data committed and unpublished until somebody happened to
  # land something else. Calling this workflow is how that gap is closed without
  # a personal access token standing in for the rule, and without a second copy
  # of the build steps drifting away from this one.
  workflow_call:
    inputs:
      ref:
        description: >-
          The commit to build. Required, and required for a reason that is
          invisible until it bites: `github.sha` inside a called workflow is the
          caller's *triggering* commit, not whatever the caller has done since.
          A scheduled refresh is triggered by the clock, so its `github.sha` is
          the head of main before the crawl -- and a deploy that took the default
          would rebuild the previous corpus and report success. Empty on the push
          and dispatch paths, where the event's own commit is the right one.
        type: string
        required: true

# Read-only by default. The job that needs to publish asks for more, and only
# that job gets it.
permissions:
  contents: read

# Never cancel a deployment already in flight: interrupting one leaves the live
# site as a half-uploaded artifact. Queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The reference scan reads `git log --all`; a shallow clone hides most
          # of the history it is meant to check.
          fetch-depth: 0
          persist-credentials: false
          # Empty on the push and dispatch paths, where checkout's own default --
          # the commit that triggered the event -- is exactly right. See the
          # input's description for why a caller must not be allowed that default.
          ref: ${{ inputs.ref }}

      # Must precede setup-node: the `cache: pnpm` option below shells out to
      # pnpm to locate the store directory, so pnpm has to exist by then.
      # No version input -- the action reads `packageManager` from package.json,
      # which keeps CI and local machines on one pinned version by construction.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages

      # Fails rather than updating the lockfile if it disagrees with the
      # manifests, which is the property `npm ci` provided.
      - run: pnpm install --frozen-lockfile

      # Before the build rather than after, so a missing secret costs seconds.
      # `verify` runs the same scan, but in its permissive mode: no token list
      # means "skipped, passed", which is right for a fork's pull request and
      # wrong here. This is the publish path -- if the list is absent, nothing
      # checked what is about to go live, and that must fail rather than pass
      # quietly.
      - run: pnpm run scan:references:strict
        env:
          PTK_PROHIBITED_TOKENS: ${{ secrets.PTK_PROHIBITED_TOKENS }}

      # The `ui` test project runs in a real browser. See the note in ci.yml.
      - run: pnpm exec playwright install --with-deps chromium

      # The commit's own timestamp, not the clock, so that a rebuild of this
      # commit publishes byte-identical files and can be checked against what
      # went live. The build reads it when it stamps `meta.json`; see
      # `readGeneratedAt` in the publish script. `fetch-depth: 0` above is what
      # makes the log available.
      # Two spellings of one fact. The publisher wants an ISO string to stamp
      # into `meta.json`; SOURCE_DATE_EPOCH is defined as seconds since the epoch
      # and the SBOM step below reads it. Deriving both from the same `git log`
      # keeps them from disagreeing about which commit is being built.
      - run: |
          echo "PTK_GENERATED_AT=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"
          echo "PTK_GENERATED_AT_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # The full check, not just a build. Nothing reaches the live site without
      # passing format, typecheck, lint, tests, and the reference scan first.
      # `build` publishes the data artifacts into `apps/web/public/data` before
      # bundling the site, so the uploaded artifact carries them.
      - run: pnpm run verify
        env:
          PTK_PROHIBITED_TOKENS: ${{ secrets.PTK_PROHIBITED_TOKENS }}
          # Empty for an organisation user site, `/<repo>` for a project site.
          # Taking it from the Pages configuration rather than hard-coding `/`
          # means renaming the repository or moving to a project site does not
          # silently break every asset URL.
          PTK_BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      # A bill of materials for what just went live, kept beside the deployment
      # rather than inside it. `verify` has already proved every licence in the
      # tree is acceptable; this records which versions those were, so that a
      # future advisory can be checked against a specific deploy instead of
      # against whatever the lockfile says today.
      #
      # SOURCE_DATE_EPOCH is the commit's own timestamp, for the same reason the
      # build takes its generation date from there: rebuilding this commit must
      # produce the same document, or the artifact cannot be checked against the
      # source it claims to describe.
      - run: pnpm run sbom
        env:
          SOURCE_DATE_EPOCH: ${{ env.PTK_GENERATED_AT_EPOCH }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
