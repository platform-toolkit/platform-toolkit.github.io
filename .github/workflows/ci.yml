name: CI

# Pull requests only. Pushes to `main` are verified by the deploy workflow,
# which runs the same `verify` script and refuses to publish if it fails --
# running both here and there would duplicate the work and invite the two to
# drift apart on what "green" means.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs, not tags. A tag can be moved to point
      # at different code; a SHA cannot. Dependabot proposes the bumps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The reference scan reads `git log --all`. A shallow clone would leave
          # it reporting a clean history because it could not see most of it.
          fetch-depth: 0
          persist-credentials: false

      # Must precede setup-node: the `cache: pnpm` option below shells out to
      # pnpm to locate the store directory, so pnpm has to exist by then.
      # No version input -- the action reads `packageManager` from package.json,
      # which keeps CI and local machines on one pinned version by construction.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Fails rather than updating the lockfile if it disagrees with the
      # manifests, which is the property `npm ci` provided.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run verify
        env:
          # Absent on pull requests from forks, because GitHub does not expose
          # secrets to them. The scan treats a missing list as "skipped" and
          # passes, which is the intended behaviour: the same commits are
          # scanned with the list before anything is published.
          PTK_PROHIBITED_TOKENS: ${{ secrets.PTK_PROHIBITED_TOKENS }}
