<!doctype html>
<html lang="en" data-theme-mode="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Platform Targets — Platform Toolkit</title>
    <meta
      name="description"
      content="Powerlifting classifications, records, and meet qualification targets on one screen."
    />
    <!--
      Runs before first paint to apply a theme an embedder forced. Must stay an
      external classic script: a module script would be deferred until after
      parsing, which is the flash of wrong theme this prevents, and an inline
      script would require weakening the Content Security Policy.
    -->
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="/src/styles.css" />
    <!--
      The same manifest as the hub, on purpose. One installed application holding
      the collection, not one installable icon per tool: `start_url` is the hub,
      so installing from here and installing from there give the same thing.
      Absent from the embed route beside this one -- see the hub for why.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Toolkit" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14171b" />
  </head>
  <body>
    <div class="page">
      <header>
        <!-- Relative, so it resolves under a subpath deploy too. See tools.ts. -->
        <a class="back-link" href="../">Platform Toolkit</a>
        <h1>Platform Targets</h1>
        <p class="tagline">
          Classifications, records, and meet qualification standards for one lifter, on one screen.
        </p>
      </header>
      <!--
        Which federation's rules this page shows. Declared here rather than
        named in the application code, so that publishing a second federation
        means adding a page instead of editing a view that reads as correct
        until the day it is not.
      -->
      <main id="app" data-federation="uspa">
        <noscript>
          <p>
            Platform Targets needs JavaScript to calculate classifications and qualification
            standards. The published source data remains available without it.
          </p>
        </noscript>
      </main>
    </div>
    <script type="module" src="/src/platform-targets/standalone.ts"></script>
  </body>
</html>
