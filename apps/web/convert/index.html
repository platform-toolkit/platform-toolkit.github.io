<!doctype html>
<html lang="en" data-theme-mode="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pounds and Kilograms — Platform Toolkit</title>
    <meta
      name="description"
      content="Convert between pounds and kilograms, and see the official USPA conversion chart weight beside the exact figure."
    />
    <!--
      Runs before first paint to apply a theme an embedder forced. Must stay an
      external classic script: a module script would be deferred until after
      parsing, which is the flash of wrong theme this prevents, and an inline
      script would require weakening the Content Security Policy.
    -->
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="/src/styles.css" />
    <!--
      The same manifest as the hub, on purpose. One installed application holding
      the collection, not one installable icon per tool: `start_url` is the hub,
      so installing from here and installing from there give the same thing.
      Absent from the embed route beside this one -- see the hub for why.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Toolkit" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14171b" />
  </head>
  <body>
    <div class="page">
      <header>
        <!-- Relative, so it resolves under a subpath deploy too. See tools.ts. -->
        <a class="back-link" href="../">Platform Toolkit</a>
        <h1>Pounds and Kilograms</h1>
        <p class="tagline">
          The exact conversion and the weight the federation's published chart actually lists — side
          by side, never merged.
        </p>
      </header>
      <!--
        Which federation's conversion chart this page quotes. Declared here rather
        than named in the application code, for the same reason Platform Targets
        declares it: a default in code stays valid the day a second federation's
        chart ships and is silently wrong from then on. A conversion chart is the
        kind of number that must never be guessed -- the whole tool exists to
        argue that 500 lb has no single right answer.
      -->
      <main id="app" data-federation="uspa">
        <noscript>
          <p>
            The converter needs JavaScript to read the published conversion chart. The chart itself
            remains available from the federation, and the rest of the collection is listed on the
            toolkit home page.
          </p>
        </noscript>
      </main>
    </div>
    <script type="module" src="/src/convert/standalone.ts"></script>
  </body>
</html>
