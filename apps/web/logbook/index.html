<!doctype html>
<html lang="en" data-theme-mode="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Training Logbook — Platform Toolkit</title>
    <meta
      name="description"
      content="Plan a session, log what you actually lifted, and keep the record on your own device."
    />
    <!--
      Runs before first paint to apply a theme an embedder forced. Must stay an
      external classic script: a module script would be deferred until after
      parsing, which is the flash of wrong theme this prevents, and an inline
      script would require weakening the Content Security Policy.
    -->
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="/src/styles.css" />
    <!--
      The same manifest as the hub, on purpose. One installed application holding
      the collection, not one installable icon per tool: `start_url` is the hub,
      so installing from here and installing from there give the same thing.
      Absent from the embed route beside this one -- see the hub for why.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Toolkit" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14171b" />
  </head>
  <body>
    <div class="page">
      <header>
        <!-- Relative, so it resolves under a subpath deploy too. See tools.ts. -->
        <a class="back-link" href="../">Platform Toolkit</a>
        <h1>Training Logbook</h1>
        <p class="tagline">
          Plan a session, tick off each set as you finish it, and keep the record on this device.
        </p>
      </header>
      <!--
        No `data-federation`. This is the only tool in the collection with no
        federation axis: it reads no published artifact and grades nothing against
        a governing body's numbers. A set of five at 140 kg is the same set of five
        whoever sanctions the meet.
      -->
      <main id="app">
        <noscript>
          <p>
            The training logbook needs JavaScript. It keeps your training in this browser's own
            storage and sends nothing anywhere, both of which are things a page can only do while it
            is running.
          </p>
        </noscript>
      </main>
    </div>
    <script type="module" src="/src/logbook/standalone.ts"></script>
  </body>
</html>
