<!doctype html>
<html lang="en" data-theme-mode="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Warm-Up Calculator — Platform Toolkit</title>
    <meta
      name="description"
      content="Barbell warm-up sets and plate loading for a working weight, on the plates you actually have."
    />
    <!--
      Runs before first paint to apply a theme an embedder forced. Must stay an
      external classic script: a module script would be deferred until after
      parsing, which is the flash of wrong theme this prevents, and an inline
      script would require weakening the Content Security Policy.
    -->
    <script src="/theme-boot.js"></script>
    <link rel="stylesheet" href="/src/styles.css" />
    <!--
      The same manifest as the hub, on purpose. One installed application holding
      the collection, not one installable icon per tool: `start_url` is the hub,
      so installing from here and installing from there give the same thing.
      Absent from the embed route beside this one -- see the hub for why.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Toolkit" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14171b" />
  </head>
  <body>
    <div class="page">
      <header>
        <!-- Relative, so it resolves under a subpath deploy too. See tools.ts. -->
        <a class="back-link" href="../">Platform Toolkit</a>
        <h1>Warm-Up Calculator</h1>
        <p class="tagline">
          Warm-up sets and plate loading for a working weight, on the plates in front of you.
        </p>
      </header>
      <!--
        No federation attribute here, unlike Platform Targets: this tool reads no
        published data at all. The ramp rules are product scope and live in code,
        so the page needs nothing but a mount point.
      -->
      <main id="app">
        <noscript>
          <p>
            The warm-up calculator needs JavaScript to work out plate loading. The rest of the
            collection is listed on the toolkit home page.
          </p>
        </noscript>
      </main>
    </div>
    <script type="module" src="/src/warm-up/standalone.ts"></script>
  </body>
</html>
